apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-backend
  namespace: millennium-credit
  labels:
    app.kubernetes.io/name: credit-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: credit-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credit-backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: europe-central2-docker.pkg.dev/PROJECT_ID/millennium-credit-gke-docker/credit-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: GOOGLE_CLOUD_REGION
              value: europe-central2
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: millennium-env
                  key: GOOGLE_CLOUD_PROJECT
            - name: USE_MOCK_VECTOR_DB
              value: "false"
            - name: USE_MOCK_LLM
              value: "false"
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: credit-backend
  namespace: millennium-credit
spec:
  selector:
    app.kubernetes.io/name: credit-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-backend
  namespace: millennium-credit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
