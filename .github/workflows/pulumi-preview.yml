# Pulumi preview against GCP using Workload Identity Federation (no JSON keys).
# Prerequisites: WIF + SA created (optional Pulumi module workload_identity_github.py),
# Environment GCP_WORKLOAD secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_GITHUB_ACTIONS_SA_EMAIL,
# PULUMI_CONFIG_PASSPHRASE (stack config decryption), PULUMI_ACCESS_TOKEN (Pulumi Cloud backend).
#
# Provider value format: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID

name: Pulumi Preview (infra)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "infra/pulumi/**"
      - ".github/workflows/pulumi-preview.yml"

concurrency:
  group: pulumi-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Secrets live in GitHub Environment "GCP_WORKLOAD" (not repository secrets).
    environment: GCP_WORKLOAD
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/pulumi
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_GITHUB_ACTIONS_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # Official install path (pulumi/setup-pulumi has no v3 tag — use actions repo).
      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          pulumi-version: "3.140.0"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pulumi preview (stack dev)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi stack select dev
          pulumi preview --non-interactive
