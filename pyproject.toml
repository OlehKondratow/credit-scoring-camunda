[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-camunda"
version = "0.1.0"
description = "Credit scoring workers and ML training for Camunda 8 (Zeebe)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Project contributors" }]
dependencies = [
  "pyzeebe>=4.0.0,<5.0.0",
  "numpy>=1.24.0,<3.0.0",
  "pandas>=2.0.0,<4.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "joblib>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
]

[project.scripts]
credit-score-worker = "worker.run_worker:cli"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["worker", "training", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["worker"]
